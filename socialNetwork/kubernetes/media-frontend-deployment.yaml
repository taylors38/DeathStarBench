apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f kompose-docker.yml -o kubernetes/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: media-frontend
  name: media-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: media-frontend
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f kompose-docker.yml -o kubernetes/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: media-frontend
    spec:
      containers:
        - image: yg397/media-frontend:xenial
          name: media-frontend
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - mountPath: /usr/local/openresty/nginx/lua-scripts
              name: media-frontend-cm0
            - mountPath: /usr/local/openresty/nginx/conf/nginx.conf
              name: media-frontend-cm1
              subPath: nginx.conf
      hostname: media-frontend
      restartPolicy: Always
      volumes:
        - configMap:
            name: media-frontend-cm0
          name: media-frontend-cm0
        - configMap:
            items:
              - key: nginx.conf
                path: nginx.conf
            name: media-frontend-cm1
          name: media-frontend-cm1
