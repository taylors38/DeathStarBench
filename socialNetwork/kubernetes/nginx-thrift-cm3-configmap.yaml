apiVersion: v1
data:
  jaeger-config.json: |-
    {
      "service_name": "nginx-web-server",
      "diabled": false,
      "reporter": {
        "logSpans": false,
        "localAgentHostPort": "jaeger-agent:6831",
        "queueSize": 1000000,
        "bufferFlushInterval": 10
      },
      "sampler": {
        "type": "probabilistic",
        "param": 0.2
      }
    }
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    io.kompose.service: nginx-thrift
  name: nginx-thrift-cm3
