  Object.lua: |
    --
    ----Author: xiajun
    ----Date: 20151120
    ----
    local function ttype(obj)
        if type(obj) == 'table' and obj.__type and type(obj.__type) == 'string' then
            return obj.__type
        end
        return type(obj)
    end
    local function __obj_index(self, key)
        local obj = rawget(self, key)
        if obj ~=nil then
            return obj
        end
        local p = rawget(self,'__parent')
        if p then
            return __obj_index(p,key)
        end
        return nil
    end

    local Object = {
        __type = 'Object',
        __mt = {
            __index = __obj_index
        }
    }
    function Object:new(init_obj)
        local obj = {}
        if ttype(obj) == 'table' then
            obj = init_obj
        end
        obj.__parent = self
        setmetatable(obj,Object.__mt)
        return obj
    end
    function Object:ttype()
        if self and self.__type then
            return self.__type
        end
        return type(self)
    end
    return Object
  RpcClient.lua: |
    --
    ----Author: xiajun
    ----Date: 20151020
    ----
    local TSocket = require "TSocket"
    local TSocketSSL = require "TSocketSSL"
    local TFramedTransport = require "TFramedTransport"
    local TBinaryProtocol = require "TBinaryProtocol"
    local Object = require "Object"

    local RpcClient = Object:new({
    	__type = 'RpcClient',
    })

    --初始化RPC连接
    function RpcClient:init(ip,port,timeout,ssl)
    	if (ssl == true) then
    		socket = TSocketSSL:new{
    			host = ip,
    			port = port
    		 }
    	else
    		socket = TSocket:new{
    			host = ip,
    			port = port
    		}
    	end
    	socket:setTimeout(timeout)
    	local transport = TFramedTransport:new{
    		trans = socket
    	}
    	local protocol = TBinaryProtocol:new{
    		trans = transport
    	}
    	transport:open()
    	return protocol;
    end
    --创建RPC客户端
    function RpcClient:createClient(thriftClient)end

    return RpcClient
  RpcClientFactory.lua: |
    --
    ----Author: xiajun
    ----Date: 20151020
    ----
    local RpcClient = require "RpcClient"
    --local TestServiceClient = require "resty.thrift.thrift-idl.lua_test_TestService"
    local RpcClientFactory = RpcClient:new({
    	__type = 'Client'
    })
    function RpcClientFactory:createClient(thriftClient, ip, port, timeout, ssl)
        local protocol = self:init(ip, port, timeout, ssl)
        local client = thriftClient:new{
            iprot = protocol,
            oprot = protocol
        }
        return client
    end
    return RpcClientFactory
