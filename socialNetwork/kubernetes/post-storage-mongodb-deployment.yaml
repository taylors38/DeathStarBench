apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f kompose-docker.yml -o kubernetes/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: post-storage-mongodb
  name: post-storage-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: post-storage-mongodb
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f kompose-docker.yml -o kubernetes/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: post-storage-mongodb
    spec:
      containers:
        - image: mongo:4.4.6
          name: post-storage-mongodb
          ports:
            - containerPort: 27017
              protocol: TCP
      hostname: post-storage-mongodb
      restartPolicy: Always
